server:
  port: ${PORT:8085}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: workflow-reliability-lab-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:workflow_lab}
    username: ${DB_USER:wrl_user}
    password: ${DB_PASSWORD:wrl_dev_password_change_me_in_prod}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: WrlHikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  threads:
    virtual:
      enabled: true

# Security & Tokens
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
  encryption:
    secret: ${ENCRYPTION_SECRET:vOVH6sdmpNWjRRIqCc7rdxs01lwHzfr3}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}
  mail:
    from: ${MAIL_FROM:noreply@workflowlab.dev}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:disabled}
    base-url: ${AI_BASE_URL:http://host.docker.internal:1234/v1}
    model: ${AI_MODEL:local-model}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-tokens: ${AI_MAX_TOKENS:2048}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Management & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
