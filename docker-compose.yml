services:
  postgres:
    image: postgres:16-alpine
    container_name: wrl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-workflow_lab}
      POSTGRES_USER: ${DB_USER:-wrl_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wrl_dev_password_change_me_in_prod}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - wrl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wrl_user} -d ${DB_NAME:-workflow_lab}"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: wrl-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    profiles:
      - dev

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: wrl-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    profiles:
      - optional-rabbitmq

volumes:
  wrl_pgdata:
    name: wrl_pgdata
